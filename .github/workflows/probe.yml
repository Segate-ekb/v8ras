name: Probe (версии RAS)

# Поднимает сервер 1С (ragent) и сервер администрирования (ras), затем гоняет
# сквозной тест против живого RAS по адресу V8RAS_E2E_RAS. Требует секретов стенда
# (загрузка платформы с releases.1c.ru и лицензии), поэтому идёт только в основном
# репозитории. Лицензия сервера ставится из секрета ONEC_SERVER_LICENCE.

# Запуск вручную: требует секретов ONEC_USERNAME/ONEC_PASSWORD (загрузка платформы
# с releases.1c.ru) помимо лицензий. Включите после их добавления.
on:
  workflow_dispatch:
  push:
    branches: ['chore/ras-probe']

permissions:
  contents: read

jobs:
  e2e:
    name: Снимки протокола
    if: ${{ github.repository_owner == 'Segate-ekb' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        oscript_version: ['2.2.1']
        # Номера сборок доступны этому аккаунту на releases.1c.ru. Линия 8.5.4
        # (тестовый релиз) аккаунту недоступна — вместо неё последняя 8.5.1.
        v8_version:
          - '8.3.18.1208'
          - '8.3.19.1150'
          - '8.3.21.1302'

    env:
      V8RAS_E2E_RAS: 'localhost:1545'

    steps:
      - name: Актуализация
        uses: actions/checkout@v4

      - name: Установка свойств git
        shell: bash
        run: |
          git config --global user.name  "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Установка OneScript
        uses: otymko/setup-onescript@v1.4
        with:
          version: ${{ matrix.oscript_version }}

      - name: Кэш пакетов OneScript
        # Пакеты (oneunit, asserts, dev-зависимости) кэшируются, чтобы не ходить
        # каждый раз в медленный хаб opm. Ключ сбрасывается при смене packagedef.
        uses: actions/cache@v4
        with:
          path: ~/.local/share/ovm
          key: ovm-${{ runner.os }}-${{ matrix.oscript_version }}-${{ hashFiles('packagedef') }}
          restore-keys: |
            ovm-${{ runner.os }}-${{ matrix.oscript_version }}-

      - name: Установка зависимостей OneScript
        run: |
          opm install opm
          opm install -l --dev
          opm install oneunit asserts

      - name: Подготовка окружения
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y locales libwebkit2gtk-4.0-37 libglu1-mesa
          sudo localedef -i ru_RU -c -f UTF-8 -A /usr/share/locale/locale.alias ru_RU.UTF-8

      - name: Установка 1С:Предприятие (сервер)
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: ${{ matrix.v8_version }}
          cache: true        # кэш установки платформы
          cache_distr: true  # кэш скачанного дистрибутива — не качать каждый раз
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}

      - name: Установка лицензии 1С
        run: |
          sudo mkdir -p /var/1C/licenses
          echo "${{ secrets.ONEC_LICENCE }}"        | sudo tee /var/1C/licenses/licence.lic        > /dev/null
          echo "${{ secrets.ONEC_SERVER_LICENCE }}" | sudo tee /var/1C/licenses/server-licence.lic > /dev/null
          sudo chmod 777 -R /var/1C/licenses

      - name: Создание conf.cfg
        run: |
          sudo mkdir -p /opt/1cv8/conf/
          sudo tee /opt/1cv8/conf/conf.cfg > /dev/null <<EOF
          DisableUnsafeActionProtection=.*
          SystemLanguage=System
          EOF
          sudo chmod 777 -R /opt/1cv8/conf/

      - name: PostgreSQL для 1С (Postgres Pro 1C 16)
        continue-on-error: true
        run: |
          set -x
          curl -fsSL https://repo.postgrespro.ru/1c-16/keys/pgpro-repo-add.sh -o /tmp/pgpro-repo-add.sh
          sudo sh /tmp/pgpro-repo-add.sh
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgrespro-1c-16
          sudo /opt/pgpro/1c-16/bin/pg-setup initdb --locale=ru_RU.UTF-8 || true
          sudo /opt/pgpro/1c-16/bin/pg-setup service start || true
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/5432) 2>/dev/null; then echo "pg поднят"; break; fi
            sleep 1
          done
          sudo -u postgres /opt/pgpro/1c-16/bin/psql -c "ALTER USER postgres PASSWORD 'pgpass'"
          sudo -u postgres /opt/pgpro/1c-16/bin/psql -c "select version()"

      - name: Запуск ragent (сервер 1С)
        run: |
          set -ex
          PLATFORM_DIR=$(ls -d /opt/1cv8/x86_64/${{ matrix.v8_version }} 2>/dev/null \
                       || ls -d /opt/1cv8/i386/${{ matrix.v8_version }})
          mkdir -p "$HOME/.1cv8-srvinfo"
          nohup "$PLATFORM_DIR/ragent" \
            -port 1540 -regport 1541 -range 1560:1591 \
            -d "$HOME/.1cv8-srvinfo" \
            > "$HOME/ragent.log" 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/1540) 2>/dev/null; then echo "ragent поднят"; break; fi
            sleep 1
          done

      - name: Запуск ras (сервер администрирования)
        run: |
          set -ex
          PLATFORM_DIR=$(ls -d /opt/1cv8/x86_64/${{ matrix.v8_version }} 2>/dev/null \
                       || ls -d /opt/1cv8/i386/${{ matrix.v8_version }})
          nohup "$PLATFORM_DIR/ras" cluster --port=1545 localhost:1540 \
            > "$HOME/ras.log" 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/1545) 2>/dev/null; then echo "ras поднят"; break; fi
            sleep 1
          done

      - name: База, правило, счётчик и лимит через rac
        continue-on-error: true
        run: |
          set -x
          PLATFORM_DIR=$(ls -d /opt/1cv8/x86_64/${{ matrix.v8_version }} 2>/dev/null \
                       || ls -d /opt/1cv8/i386/${{ matrix.v8_version }})
          RAC="$PLATFORM_DIR/rac"
          mkdir -p rac-state
          CL=$("$RAC" cluster list | awk '/^cluster/{print $3; exit}')
          SRV=$("$RAC" server list --cluster=$CL | awk '/^server/{print $3; exit}')
          "$RAC" infobase create --cluster=$CL --create-database --name=ib1 --dbms=PostgreSQL \
            --db-server=localhost --db-name=ib1 --locale=ru_RU --db-user=postgres --db-pwd=pgpass \
            --descr="Test base" --license-distribution=allow --date-offset=2000 --security-level=1 \
            | tee rac-state/infobase-create.txt || true
          IB=$("$RAC" infobase summary list --cluster=$CL | awk '/^infobase/{print $3; exit}')
          "$RAC" infobase update --cluster=$CL --infobase=$IB \
            --disable-local-speech-to-text=yes \
            --configuration-unload-delay-by-working-process-without-active-users=111 \
            --minimum-scheduled-jobs-start-period-without-active-users=222 \
            --maximum-scheduled-jobs-start-shift-without-active-users=333 \
            --reserve-working-processes=yes --scheduled-jobs-deny=on \
            --denied-message="stop" --denied-parameter="param" --permission-code="code" \
            --external-session-manager-connection-string="http://esm" --security-profile-name="" \
            | tee rac-state/infobase-update.txt || true
          "$RAC" infobase info --cluster=$CL --infobase=$IB > rac-state/infobase-info.txt 2>&1 || true
          "$RAC" rule insert --cluster=$CL --server=$SRV --position=0 --rule-type=always --infobase-name=ib1 --priority=5 | tee rac-state/rule-insert.txt || true
          "$RAC" rule list --cluster=$CL --server=$SRV > rac-state/rule-list.txt 2>&1 || true
          "$RAC" counter update --cluster=$CL --name=cnt1 --collection-time=600 --group=users --filter-type=all --duration=analyze --memory=analyze --descr="c1" | tee rac-state/counter-update.txt || true
          "$RAC" counter list --cluster=$CL > rac-state/counter-list.txt 2>&1 || true
          "$RAC" limit update --cluster=$CL --name=lim1 --counter=cnt1 --duration=1000 --memory=2000 --action=none --error-message="too much" --descr="l1" | tee rac-state/limit-update.txt || true
          "$RAC" limit list --cluster=$CL > rac-state/limit-list.txt 2>&1 || true
          "$RAC" service-setting list --cluster=$CL --server=$SRV > rac-state/service-setting-list.txt 2>&1 || true

      - name: Проба версий сервиса 3–24
        run: oscript tools/probe/probe-port.os 1545 "3.0,4.0,5.0,6.0,7.0,8.0,9.0,10.0,11.0,12.0,13.0,14.0,15.0,16.0,17.0,18.0,19.0,20.0,21.0,22.0,23.0,24.0" | tee probe.log

      - name: Снимки ответов на версиях 16–22
        run: |
          mkdir -p dump
          for v in 12.0 13.0 14.0 15.0 16.0 17.0 18.0 19.0 20.0 21.0 22.0; do
            oscript tools/probe/dump.os "$PWD/dump" 1545 "$v" "" >> dump/dump.log 2>&1 || true
          done
          tail -40 dump/dump.log

      - name: Справка и состояние rac
        run: |
          PLATFORM_DIR=$(ls -d /opt/1cv8/x86_64/${{ matrix.v8_version }} 2>/dev/null \
                       || ls -d /opt/1cv8/i386/${{ matrix.v8_version }})
          RAC="$PLATFORM_DIR/rac"
          mkdir -p rac-help
          for m in cluster server process service infobase rule counter limit session connection agent manager profile lock service-setting binary-data-storage; do
            "$RAC" help $m > rac-help/$m.txt 2>&1 || true
          done
          "$RAC" help > rac-help/modes.txt 2>&1 || true
          CL=$("$RAC" cluster list | awk '/^cluster/{print $3; exit}')
          "$RAC" cluster info --cluster=$CL > rac-help/cluster-info.txt 2>&1 || true
          SRV=$("$RAC" server list --cluster=$CL | awk '/^server/{print $3; exit}')
          "$RAC" server info --cluster=$CL --server=$SRV > rac-help/server-info.txt 2>&1 || true
          "$RAC" service list --cluster=$CL > rac-help/service-list.txt 2>&1 || true
          "$RAC" process list --cluster=$CL > rac-help/process-list.txt 2>&1 || true

      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ras-dump-${{ matrix.v8_version }}
          path: |
            probe.log
            dump/
            rac-help/
            rac-state/
